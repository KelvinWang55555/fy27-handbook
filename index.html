<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FY27 Sales Domain Handbook · 查询工具</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{
  --petrol:#00847a; --petrol-d:#00665e; --petrol-l:#e6f4f2;
  --ink:#12222c; --ink-2:#41525e; --ink-3:#73828c;
  --line:#dde4e9; --bg:#f4f6f8; --card:#ffffff;
  --amber:#b26a00; --amber-bg:#fff4e0;
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6}
.hide{display:none!important}
a{color:var(--petrol-d);text-decoration:none}
a:hover{text-decoration:underline}

.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0f2b33,#123c3a 45%,#0d1f26);z-index:100;padding:20px}
.gate-box{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:30px 26px 24px;
  box-shadow:0 24px 60px rgba(0,0,0,.35)}
.gate-logo{font-size:12px;letter-spacing:.18em;color:var(--petrol);font-weight:700;text-transform:uppercase}
.gate h1{font-size:21px;margin:8px 0 4px;line-height:1.35}
.gate p{color:var(--ink-3);font-size:13px;margin:0 0 18px}
.gate input#pw{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;outline:none}
.gate input#pw:focus{border-color:var(--petrol)}
.gate button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--petrol);
  color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.gate button:active{background:var(--petrol-d)}
.gate .msg{font-size:13px;color:#c0392b;min-height:18px;margin-top:10px}
.gate .remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-top:12px}
.gate .warn{font-size:11.5px;color:var(--ink-3);margin-top:16px;border-top:1px solid var(--line);padding-top:12px}

header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-size:16px;letter-spacing:.02em}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.search{flex:1;position:relative;min-width:120px}
.search input{width:100%;padding:9px 34px 9px 34px;border:1.5px solid var(--line);border-radius:10px;
  background:#fbfcfd;font-size:14px;outline:none}
.search input:focus{border-color:var(--petrol);background:#fff}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--ink-3);font-size:16px;cursor:pointer;padding:4px}
nav{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:9px 13px 10px;font-size:13.5px;color:var(--ink-2);cursor:pointer;
  border-bottom:2.5px solid transparent;white-space:nowrap;font-weight:500}
nav button.on{color:var(--petrol-d);border-color:var(--petrol);font-weight:700}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
h2.sec{font-size:17px;margin:0 0 4px}
.sub{color:var(--ink-3);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.chip:hover{border-color:var(--petrol);color:var(--petrol-d)}
.chip.on{background:var(--petrol);border-color:var(--petrol);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.btn:hover{border-color:var(--petrol);color:var(--petrol-d)}
.btn:disabled{opacity:.5;cursor:default}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;background:var(--petrol-l);
  color:var(--petrol-d);margin-right:4px;white-space:nowrap}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.2;color:var(--petrol-d)}
.stat span{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.flow{display:flex;flex-direction:column;gap:2px}
.flow a{display:flex;align-items:baseline;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line);color:var(--ink)}
.flow a:last-child{border-bottom:0}
.flow a:hover{background:var(--petrol-l);text-decoration:none;border-radius:6px}
.flow em{font-style:normal;font-size:11px;color:var(--ink-3);width:34px;flex:none}
.flow i{font-style:normal;flex:1;font-size:14px}
.flow s{text-decoration:none;font-size:11.5px;color:var(--ink-3)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.rhits{font-size:13px;color:var(--ink-3);margin:0 0 12px}
.hit{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;cursor:pointer;
  transition:border-color .12s,box-shadow .12s}
.hit:hover{border-color:var(--petrol);box-shadow:0 3px 12px rgba(0,80,70,.07)}
.hit-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.hit-h b{font-size:14.5px}
.pill{font-size:11px;background:#eef2f6;color:var(--ink-2);padding:1px 8px;border-radius:6px}
.snip{font-size:13px;color:var(--ink-2);line-height:1.65}
mark{background:#ffe9a8;padding:0 1px;border-radius:2px;color:inherit}

.browse{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;position:sticky;top:112px}
.side h4{margin:6px 4px 8px;font-size:12px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.side .item{padding:6px 9px;border-radius:8px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;color:var(--ink-2)}
.side .item:hover{background:#f1f5f7}
.side .item.on{background:var(--petrol-l);color:var(--petrol-d);font-weight:600}
.side .item u{text-decoration:none;font-size:11px;color:var(--ink-3)}
.viewer{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.vbar b{font-size:14.5px}
.vbar .sp{flex:1}
.slidewrap{background:#0d1b22;display:flex;justify-content:center}
.slide{width:100%;height:auto;display:block;cursor:zoom-in}
.vfoot{padding:14px 16px}
.vfoot .txt{font-size:13.5px;color:var(--ink-2);line-height:1.75}
.linklist{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.linkrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.linkrow .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow .dot{color:var(--ink-3);font-size:11px;flex:none}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tbl{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tbl .row{display:grid;grid-template-columns:88px 1fr 78px 60px;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  align-items:center;font-size:13.5px}
.tbl .row:last-child{border-bottom:0}
.tbl .row.head{background:#f7f9fa;font-size:12px;color:var(--ink-3);font-weight:600}
.tbl .row .u{color:var(--petrol-d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.tbl .row .copy{border:1px solid var(--line);background:#fff;border-radius:7px;font-size:11.5px;padding:3px 8px;cursor:pointer;color:var(--ink-2)}
.morewrap{display:flex;justify-content:center;padding:14px}

.ana h3{font-size:15.5px;margin:22px 0 8px;padding-left:10px;border-left:3px solid var(--petrol)}
.ana p{color:var(--ink-2);font-size:14px;margin:0 0 10px}
.ana ul{margin:0 0 14px;padding-left:20px;color:var(--ink-2);font-size:14px}
.ana li{margin-bottom:6px;line-height:1.7}
.ana .note{background:var(--amber-bg);border-left:3px solid var(--amber);padding:10px 14px;border-radius:8px;font-size:13.5px;color:#6b4a00}

footer{max-width:1180px;margin:0 auto;padding:0 16px 30px;color:var(--ink-3);font-size:11.5px;text-align:center}

.zoom{position:fixed;inset:0;background:rgba(6,15,20,.94);z-index:60;overflow:auto;padding:20px;display:flex;align-items:flex-start;justify-content:center}
.zoom img{max-width:none;width:auto;height:auto;border-radius:6px}
.zoom .x{position:fixed;right:16px;top:14px;background:#fff;border:0;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}

@media(max-width:860px){
  .browse{grid-template-columns:1fr}
  .side{position:static;order:2}
  .grid2{grid-template-columns:1fr}
  .hd{flex-wrap:wrap;gap:8px}
  .brand span{display:none}
  .tbl .row.head{display:none}
  .tbl .row{grid-template-columns:1fr 52px;gap:8px;font-size:12px}
  .tbl .row .sub{display:none}
  .tbl .row .u{grid-column:1;grid-row:1;white-space:normal;word-break:break-all;line-height:1.5}
  .tbl .row .copy{grid-column:2;grid-row:1}
  main{padding:12px 10px 50px}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="brand"><b>FY27 Sales Domain</b><span>HANDBOOK</span></div>
    <div class="search">
      <span class="ico">⌕</span>
      <input id="q" type="search" placeholder="搜索：SPR / Goodwill / S200 / 组织架构 / 产品型号 …" autocomplete="off">
      <button class="clr hide" id="qc">×</button>
    </div>
  </div>
  <nav id="nav">
    <button data-v="overview" class="on">概览</button>
    <button data-v="browse">手册浏览</button>
    <button data-v="links">资源链接</button>
    <button data-v="analysis">分析报告</button>
    <button data-v="help">使用说明</button>
  </nav>
</header>

<main id="main"></main>
<footer>FY27 Sales Domain Handbook · 仅供内部查询使用 · 请勿转发链接</footer>

<script>
const S = { data:null, kv:null, slides:null, pages:[], cur:1, view:'overview', q:'', section:'all', linkTag:'all', linkQ:'', urls:{} };
const $ = function(s){ return document.querySelector(s); };
const esc = function(s){ return (s||'').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
const SECTIONS = [['全部','all'],['Who 组织与角色','who'],['What 产品与资料','what'],['How 政策与流程','how']];

async function grab(url){
  return new Uint8Array(await (await fetch(url, {cache:'no-store'})).arrayBuffer());
}
async function boot(){
  S.data = await (await fetch('data.json', {cache:'no-store'})).json();
  S.pages = S.data.pages;
  S.slides = null; S.urls = {};
  render();
}
async function ensureSlides(){
  if (S.slides) return S.slides;
  S.slides = await grab('slides.raw');
  return S.slides;
}
function slideUrl(p){
  if (S.urls[p]) return S.urls[p];
  if (!S.slides) return '';
  const pg = S.pages.find(function(x){ return x.p === p; });
  const off = pg.si[0], len = pg.si[1];
  const blob = new Blob([S.slides.slice(off, off+len)], {type:'image/jpeg'});
  S.urls[p] = URL.createObjectURL(blob);
  return S.urls[p];
}

function norm(s){ return (s||'').toLowerCase(); }
function terms(q){ return norm(q).split(/\s+/).filter(Boolean); }
function scorePage(pg, ts){
  let sc = 0;
  const t = norm(pg.t), x = norm(pg.x), s = norm(pg.s + ' ' + (pg.g||[]).join(' '));
  const k = norm((pg.k||[]).map(function(l){ return l.l+' '+l.c+' '+l.h+' '+l.r; }).join(' | '));
  for (var i=0;i<ts.length;i++){
    var term = ts[i], hit = false;
    if (t.indexOf(term) >= 0) { sc += 14; hit = true; }
    if (s.indexOf(term) >= 0) { sc += 5; hit = true; }
    if (k.indexOf(term) >= 0) { sc += 6; hit = true; }
    if (x.indexOf(term) >= 0) { sc += Math.min(x.split(term).length-1, 6); hit = true; }
    if (!hit) return -1;
  }
  if (t === 'table of contents') sc -= 40;
  if (pg.s === '封面' || pg.s === '封底') sc -= 30;
  return sc;
}
function hl(html, ts){
  var out = html;
  ts.forEach(function(t){
    var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    out = out.replace(re, '<mark>$1</mark>');
  });
  return out;
}
function snip(text, ts){
  var nt = norm(text), pos = -1;
  ts.forEach(function(t){ var i2 = nt.indexOf(t); if (i2 >= 0 && (pos < 0 || i2 < pos)) pos = i2; });
  if (pos < 0) pos = 0;
  var st = Math.max(0, pos - 46), en = Math.min(text.length, pos + 128);
  return (st>0?'…':'') + hl(esc(text.slice(st,en)), ts) + (en<text.length?'…':'');
}
function doSearch(q){
  var ts = terms(q);
  if (!ts.length) return [];
  return S.pages.map(function(pg){ return {pg:pg, sc:scorePage(pg, ts)}; })
    .filter(function(r){ return r.sc >= 0; })
    .sort(function(a,b){ return b.sc - a.sc || a.pg.p - b.pg.p; })
    .slice(0, 60);
}

function render(){
  var m = $('#main');
  $('#qc').classList.toggle('hide', !S.q);
  if (S.q.trim()) { renderSearch(m); return; }
  if (S.view === 'overview') renderOverview(m);
  else if (S.view === 'browse') renderBrowse(m);
  else if (S.view === 'links') renderLinks(m, 100);
  else if (S.view === 'analysis') renderAnalysis(m);
  else renderHelp(m);
}

function renderOverview(m){
  var d = S.data, st = d.stats || {};
  m.innerHTML =
  '<div class="stats">' +
    '<div class="stat"><b>' + (st.pages||87) + '</b><span>手册页数</span></div>' +
    '<div class="stat"><b>' + (st.links||'') + '</b><span>内部资料链接</span></div>' +
    '<div class="stat"><b>' + (st.products||'') + '</b><span>覆盖产品线</span></div>' +
    '<div class="stat"><b>' + (st.processes||'') + '</b><span>政策与流程</span></div>' +
  '</div>' +
  '<div class="card" style="margin-bottom:14px">' +
    '<h2 class="sec">一句话定位</h2>' +
    '<p class="sub" style="font-size:13.5px;line-height:1.75;color:#41525e">' + esc(d.blurb||'') + '</p>' +
    '<div class="quick">' + (d.quick||[]).map(function(x){ return '<span class="chip" data-q="' + esc(x.q) + '">' + esc(x.label) + '</span>'; }).join('') + '</div>' +
  '</div>' +
  '<div class="grid2">' +
    '<div class="card"><h2 class="sec">按章节直达</h2><div class="sub" style="margin-bottom:6px">点击进入对应页</div><div class="flow">' +
      (d.toc||[]).map(function(x){ return '<a data-goto="' + x.p + '"><em>P' + x.p + '</em><i>' + esc(x.t) + '</i><s>' + esc(x.s) + '</s></a>'; }).join('') +
    '</div></div>' +
    '<div class="card"><h2 class="sec">高频场景</h2><div class="sub" style="margin-bottom:6px">找资料 / 走流程 / 找人</div><div class="flow">' +
      (d.scenes||[]).map(function(x){ return '<a data-q="' + esc(x.q) + '"><em>›</em><i>' + esc(x.t) + '</i><s>' + esc(x.hint||'') + '</s></a>'; }).join('') +
    '</div></div>' +
  '</div>';
  m.querySelectorAll('[data-goto]').forEach(function(el){
    el.onclick = function(){ S.view='browse'; S.cur=+el.dataset.goto; setTab(); render(); };
  });
  m.querySelectorAll('[data-q]').forEach(function(el){
    el.onclick = function(){ $('#q').value = el.dataset.q; S.q = el.dataset.q; render(); };
  });
}

function inSection(pg){
  if (S.section === 'all') return true;
  if (S.section === 'who') return pg.p >= 3 && pg.p <= 28;
  if (S.section === 'what') return pg.p >= 29 && pg.p <= 45;
  return pg.p >= 46;
}

function renderBrowse(m){
  var pg = S.pages.find(function(x){ return x.p === S.cur; }) || S.pages[0];
  S.cur = pg.p;
  var groups = {};
  S.pages.forEach(function(p){ (groups[p.s] = groups[p.s] || []).push(p); });
  var navList = Object.keys(groups).map(function(k){
    return '<div class="item ' + (k===pg.s?'on':'') + '" data-sec="' + esc(k) + '"><span>' + esc(k) + '</span><u>' + groups[k].length + '</u></div>';
  }).join('');
  var links = '';
  if (pg.k && pg.k.length){
    links = '<div class="linklist"><div class="sub" style="margin-bottom:6px">本页链接 ' + pg.k.length + ' 条</div>' +
      pg.k.slice(0,40).map(function(l){
        return '<div class="linkrow"><span class="lab">' + esc(bestLabel(l) || (((pg.g||[])[0] || pg.s) + ' 资料')) + '</span>' +
        '<a class="dot" href="' + esc(l.u) + '" target="_blank" rel="noopener">打开 ↗</a>' +
        '<button class="copy btn" data-c="' + esc(l.u) + '" style="padding:2px 8px">复制</button></div>';
      }).join('') +
      (pg.k.length>40 ? '<div class="sub" style="margin-top:8px">仅显示前 40 条，完整清单见「资源链接」。</div>' : '') + '</div>';
  }
  m.innerHTML =
  '<div class="browse">' +
    '<aside class="side"><h4>章节</h4>' + navList +
      '<h4 style="margin-top:14px">快捷跳页</h4>' +
      '<div class="item" data-jump="1"><span>封面 / 目录</span><u>P1</u></div>' +
      '<div class="item" data-jump="5"><span>组织架构</span><u>P5</u></div>' +
      '<div class="item" data-jump="23"><span>角色职责</span><u>P23</u></div>' +
      '<div class="item" data-jump="31"><span>重点产品</span><u>P31</u></div>' +
      '<div class="item" data-jump="37"><span>资料链接</span><u>P37</u></div>' +
      '<div class="item" data-jump="48"><span>政策流程</span><u>P48</u></div>' +
      '<div class="item" data-jump="78"><span>TPS / TPE</span><u>P78</u></div>' +
    '</aside>' +
    '<section class="viewer">' +
      '<div class="vbar"><b>' + esc(pg.t) + '</b><span class="pill">' + esc(pg.s) + '</span><span class="sp"></span>' +
        '<button class="btn" id="prev">‹ 上一页</button><span class="sub">' + pg.p + ' / ' + S.pages.length + '</span>' +
        '<button class="btn" id="next">下一页 ›</button></div>' +
      '<div class="slidewrap"><img class="slide" id="slide" alt="P' + pg.p + '"></div>' +
      '<div class="vfoot"><div class="txt">' + esc(pg.x) + '</div>' + links + '</div>' +
    '</section>' +
  '</div>';

  var img = $('#slide');
  ensureSlides().then(function(){ img.src = slideUrl(pg.p); }).catch(function(){
    img.alt = '本页图像解密失败，请刷新后重试';
  });
  img.onclick = function(){
    if (!img.src) return;
    var z = document.createElement('div');
    z.className = 'zoom';
    z.innerHTML = '<button class="x">×</button><img src="' + img.src + '">';
    z.onclick = function(e){ if (e.target === z || e.target.classList.contains('x')) z.remove(); };
    document.body.appendChild(z);
  };
  $('#prev').onclick = function(){ S.cur = Math.max(1, S.cur-1); render(); window.scrollTo(0,0); };
  $('#next').onclick = function(){ S.cur = Math.min(S.pages.length, S.cur+1); render(); window.scrollTo(0,0); };
  m.querySelectorAll('[data-sec]').forEach(function(el){
    el.onclick = function(){ S.cur = groups[el.dataset.sec][0].p; render(); };
  });
  m.querySelectorAll('[data-jump]').forEach(function(el){
    el.onclick = function(){ S.cur = +el.dataset.jump; render(); };
  });
  m.querySelectorAll('.copy').forEach(function(b){
    b.onclick = function(e){ e.preventDefault(); copyText(b.dataset.c, b); };
  });
}

function copyText(txt, btn){
  navigator.clipboard.writeText(txt).then(function(){
    if (!btn) return;
    var old = btn.textContent; btn.textContent = '已复制';
    setTimeout(function(){ btn.textContent = old; }, 1200);
  });
}

function cleanLabel(s){
  if (!s) return '';
  s = s.replace(/\(RC-CN/g,' ').replace(/\b(RC-CN|SH&I|MB-I|Bin|Xiao|Wang,|Wang|TS\)|SRE)\b/g,' ');
  s = s.replace(/[·•]/g,' ').replace(/\s+/g,' ').trim();
  var parts = s.split(' ').filter(Boolean), out = [];
  parts.forEach(function(p){ if (out[out.length-1] !== p) out.push(p); });
  return out.join(' ').trim();
}
function bestLabel(l){
  var cand = [l.h, l.c, l.r, l.l].map(cleanLabel).filter(function(s){
    return s && s.length >= 3 && s.length <= 48 && /[A-Za-z0-9\u4e00-\u9fa5]/.test(s)
      && !/^Y+$/.test(s) && !/https?:|=|knowledgePool/i.test(s);
  });
  if (!cand.length) return '';
  cand.sort(function(a,b){
    var ta = a.split(' ').length, tb = b.split(' ').length;
    if (ta !== tb) return ta - tb;
    return a.length - b.length;
  });
  return cand[0].slice(0,60);
}
function allLinks(){
  if (S._links) return S._links;
  var rows = [], seen = {};
  S.pages.forEach(function(pg){
    (pg.k||[]).forEach(function(l){
      var key = pg.p + '|' + l.u;
      if (seen[key]) return;
      seen[key] = 1;
      var lab = bestLabel(l) || (((pg.g||[])[0] || pg.s) + ' 资料');
      rows.push({pg:pg, l:{u:l.u, label:lab}});
    });
  });
  S._links = rows; return rows;
}
function linkTagOf(l){
  var u = l.u || '';
  if (u.indexOf('mailto:') === 0) return '邮件';
  if (u.indexOf('saleslibrary') >= 0) return 'Sales Library';
  if (u.indexOf('siaonline') >= 0) return 'SIA';
  if (u.indexOf('1847') >= 0) return '1847';
  if (u.indexOf('siemens.com') >= 0) return '其他平台';
  return '其他';
}
function renderLinks(m, limit){
  limit = limit || 100;
  var tags = ['all','Sales Library','SIA','1847','其他平台','邮件'];
  var q = norm(S.linkQ);
  var rows = allLinks();
  if (S.linkTag !== 'all') rows = rows.filter(function(r){ return linkTagOf(r.l) === S.linkTag; });
  if (S.section !== 'all') rows = rows.filter(function(r){ return inSection(r.pg); });
  if (q) rows = rows.filter(function(r){
    return norm(r.l.label+' '+r.pg.s+' '+r.pg.t+' '+(r.pg.g||[]).join(' ')).indexOf(q) >= 0;
  });
  var shown = rows.slice(0, limit);
  m.innerHTML =
  '<div class="card" style="margin-bottom:14px"><h2 class="sec">资源链接库</h2>' +
  '<div class="sub">手册内全部可点击链接，按平台与关键词筛选；点击直接打开，或复制链接发给同事。</div></div>' +
  '<div class="filters">' + SECTIONS.map(function(x){
      return '<span class="chip ' + (S.section===x[1]?'on':'') + '" data-sec="' + x[1] + '">' + x[0] + '</span>';
    }).join('') + '</div>' +
  '<div class="filters">' + tags.map(function(t){
      return '<span class="chip ' + (S.linkTag===t?'on':'') + '" data-tag="' + t + '">' + (t==='all'?'全部平台':t) + '</span>';
    }).join('') +
    '<input id="lq" value="' + esc(S.linkQ) + '" placeholder="按型号 / 关键词过滤，如 S200、SITRANS、SCALANCE" style="flex:1;min-width:190px;padding:6px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:13px;outline:none">' +
  '</div>' +
  '<div class="tbl"><div class="row head"><span>产品线</span><span>链接</span><span>页面</span><span></span></div>' +
    shown.map(function(r){
      return '<div class="row"><span class="sub">' + esc((r.pg.g||[])[0]||r.pg.s) + '</span>' +
        '<a class="u" href="' + esc(r.l.u) + '" target="_blank" rel="noopener">' + esc(r.l.label) + '</a>' +
        '<span class="sub" data-goto="' + r.pg.p + '" style="cursor:pointer">P' + r.pg.p + '</span>' +
        '<button class="copy" data-c="' + esc(r.l.u) + '">复制</button></div>';
    }).join('') + '</div>' +
  '<div class="morewrap">' + (rows.length>shown.length
    ? '<button class="btn" id="more">再显示 ' + Math.min(100, rows.length-shown.length) + ' 条（共 ' + rows.length + '）</button>'
    : '<span class="sub">共 ' + rows.length + ' 条</span>') + '</div>';

  m.querySelectorAll('[data-sec]').forEach(function(el){
    el.onclick = function(){ S.section = el.dataset.sec; renderLinks(m, limit); };
  });
  m.querySelectorAll('[data-tag]').forEach(function(el){
    el.onclick = function(){ S.linkTag = el.dataset.tag; renderLinks(m, limit); };
  });
  var lq = $('#lq');
  lq.oninput = function(){ S.linkQ = lq.value; renderLinks(m, limit); var n = $('#lq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  m.querySelectorAll('.copy').forEach(function(b){ b.onclick = function(){ copyText(b.dataset.c, b); }; });
  m.querySelectorAll('[data-goto]').forEach(function(el){
    el.onclick = function(){ S.view='browse'; S.cur = +el.dataset.goto; setTab(); render(); };
  });
  var more = $('#more');
  if (more) more.onclick = function(){ renderLinks(m, limit+100); };
}

function renderAnalysis(m){
  var a = S.data.analysis || [];
  m.innerHTML = '<div class="card ana"><h2 class="sec">手册分析</h2>' +
    '<div class="sub" style="margin-bottom:4px">基于手册 87 页内容整理；结论仅供参考，执行以原始页面为准。</div>' +
    a.map(function(sec){
      return '<h3>' + esc(sec.h) + '</h3>' +
        (sec.p ? '<p>' + esc(sec.p) + '</p>' : '') +
        (sec.li ? '<ul>' + sec.li.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>' : '') +
        (sec.note ? '<div class="note">' + esc(sec.note) + '</div>' : '');
    }).join('') + '</div>';
}

function renderHelp(m){
  m.innerHTML = '<div class="card ana"><h2 class="sec">使用说明</h2>' +
  '<h3>三种最常用方式</h3><ul>' +
  '<li><b>查具体内容</b>：顶部搜索框输入关键词（中英文均可，例如 <i>SPR 审批</i>、<i>SITRANS</i>、<i>Goodwill 额度</i>），即输即搜，点结果直达对应页。</li>' +
  '<li><b>查资料链接</b>：进入「资源链接」，按产品线（AUT / MO / DR / HMA / DCS / PIA / CON / SV）或型号过滤，点「打开」直接跳内网平台，「复制」可取链接。</li>' +
  '<li><b>看原版排版</b>：进入「手册浏览」，左侧按章节选，右上「上一页 / 下一页」翻页，点图片可放大查看完整版式。</li>' +
  '</ul>' +
  '<h3>关于安全</h3><ul>' +
  '<li>页面本身不含任何正文，手册文字与页面图都存放在加密文件里，只有输入正确口令才会在本机浏览器中解密。</li>' +
  '<li>口令不会发送到服务器；勾选「记住口令」后仅保存在本机浏览器。</li>' +
  '<li>内容仅限西门子 DI 销售内部使用，请勿对外分享链接、口令或截图。</li>' +
  '</ul>' +
  '<h3>快捷键</h3><ul><li>手册浏览时：<b>←</b> / <b>→</b> 翻页；<b>Esc</b> 关闭放大图。</li></ul></div>';
}

function renderSearch(m){
  var hits = doSearch(S.q), ts = terms(S.q);
  if (!hits.length){
    m.innerHTML = '<div class="rhits">“' + esc(S.q) + '” · 没有匹配内容</div>' +
      '<div class="card sub">可尝试更短的关键词，例如「SPR」「Goodwill」「S200」「组织架构」。</div>';
    return;
  }
  m.innerHTML = '<div class="rhits">“' + esc(S.q) + '” · 命中 ' + hits.length + ' 页</div>' +
    hits.map(function(h){
      return '<div class="hit" data-goto="' + h.pg.p + '">' +
        '<div class="hit-h"><b>' + hl(esc(h.pg.t), ts) + '</b><span class="pill">P' + h.pg.p + '</span>' +
        '<span class="pill">' + esc(h.pg.s) + '</span>' +
        (h.pg.g||[]).map(function(g){ return '<span class="tag">' + esc(g) + '</span>'; }).join('') + '</div>' +
        '<div class="snip">' + snip(h.pg.x, ts) + '</div></div>';
    }).join('');
  m.querySelectorAll('[data-goto]').forEach(function(el){
    el.onclick = function(){
      S.cur = +el.dataset.goto; S.view = 'browse'; S.q = ''; $('#q').value = ''; setTab(); render();
    };
  });
}

function setTab(){
  document.querySelectorAll('#nav button').forEach(function(b){
    b.classList.toggle('on', !S.q && b.dataset.v === S.view);
  });
}

document.querySelectorAll('#nav button').forEach(function(b){
  b.onclick = function(){
    S.view = b.dataset.v; S.q = ''; $('#q').value = '';
    if (S.view === 'browse' && !S.cur) S.cur = 1;
    setTab(); render();
  };
});
var tmr = null;
$('#q').oninput = function(e){
  S.q = e.target.value;
  clearTimeout(tmr);
  tmr = setTimeout(function(){ setTab(); render(); }, 180);
};
$('#qc').onclick = function(){ S.q = ''; $('#q').value = ''; setTab(); render(); };
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ document.querySelectorAll('.zoom').forEach(function(z){ z.remove(); }); }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (S.view !== 'browse' || S.q) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); S.cur = Math.min(S.pages.length, S.cur+1); render(); }
  if (e.key === 'ArrowLeft'){ e.preventDefault(); S.cur = Math.max(1, S.cur-1); render(); }
});

(function init(){
  boot().catch(function(err){
    $('#main').innerHTML = '<div class="card" style="padding:24px">加载失败：' + esc(err.message) +
      '<br>请通过 HTTP 访问本页（例如 GitHub Pages 链接），直接双击本地文件会被浏览器拦截。</div>';
  });
})();
</script>
